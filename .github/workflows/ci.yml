name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows 必跑（Win-first dogfood，设计 §3）
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p eyescare-core -p eyescare-platform
      - name: Platform-win build
        run: cargo build -p eyescare-platform-win
      - name: Clippy (core + win)
        run: cargo clippy -p eyescare-core -p eyescare-platform-win -- -D warnings

  # macOS 并行，不阻塞 Win 发布（KD16）
  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p eyescare-core -p eyescare-platform
      - name: Platform-mac stub build
        run: cargo build -p eyescare-platform-mac

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  # windows-latest 自带 MSVC + WebView2，产出 NSIS 安装包
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build Tauri (NSIS)
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EyesCare-windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe