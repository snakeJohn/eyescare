name: Unzip source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into repo
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n1)
          echo "ZIP=$ZIP"
          test -n "$ZIP"
          mkdir -p /tmp/src
          unzip -o "$ZIP" -d /tmp/src
          if [ -f /tmp/src/Cargo.toml ]; then
            SRC=/tmp/src
          else
            SRC=$(find /tmp/src -mindepth 1 -maxdepth 1 -type d | head -n1)
          fi
          echo "SRC=$SRC"
          rsync -a --exclude='.git' --exclude='*.zip' --exclude='.github/workflows' "$SRC"/ ./
          test -f Cargo.toml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Extract source from uploaded zip" || echo "nothing to commit"
          git push