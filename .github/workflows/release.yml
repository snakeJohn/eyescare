name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must already exist, e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri (NSIS)
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $found = @()
          foreach ($pat in @(
            "target/release/bundle/nsis/*.exe",
            "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          )) {
            $found += @(Get-ChildItem -Path $pat -ErrorAction SilentlyContinue)
          }
          if ($found.Count -eq 0) {
            throw "NSIS installer not found"
          }
          $found | Copy-Item -Destination dist-release -Force
          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Create portable Windows archive
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path "target/release/eyescare-desktop.exe", "apps/desktop/src-tauri/target/release/eyescare-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $binary) { throw "Portable executable not found" }
          $portable = "dist-release/EyesCare-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows-x64-portable.zip"
          Compress-Archive -Path $binary.FullName -DestinationPath $portable -Force
          Get-Item $portable | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: EyesCare ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-release/*
          body: |
            EyesCare 第一版（v0.1.0）Windows 安装包。

            - 托盘常驻、滤镜旁路、场景规则、引导休息、本地洞察
            - 安装后从托盘打开设置；退出托盘才会还原 gamma
            - 未签名：SmartScreen 可能提示，选「仍要运行」即可

            资源里同时提供 NSIS 安装包和 Windows x64 免安装 ZIP（解压后直接运行）。
