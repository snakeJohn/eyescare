# 发布 Windows 安装包到 GitHub Releases。
#
# 用法 1（默认）：推送到 main / master
#   自动 patch +1、提交 chore(release)、打 tag、上传 NSIS + portable
#   提交说明含 [skip release] 或本身是 chore(release) 则跳过
#
# 用法 2：Actions → Release → Run workflow
#   - version 留空 + bump=patch：按当前版本发下一个补丁版（0.5.0 → v0.5.1）
#   - version=0.2.0：发布指定版本
#
# 用法 3：本地打 tag 后推送
#   git tag v0.2.0 && git push origin v0.2.0
#   tag 必须与 tauri.conf.json 中的 version 一致
name: Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "新版本号（0.2.0 或 v0.2.0）。留空则按 bump 或当前仓库版本发版"
        required: false
        type: string
      bump:
        description: "未填写 version 时，按当前版本自动递增"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: "标记为 Pre-release"
        type: boolean
        default: false
      draft:
        description: "创建为草稿 Release（不公开）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eyescare-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and optionally bump
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_BUMP: ${{ inputs.bump || 'none' }}
          INPUT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          def write_output(**kwargs):
              path = os.environ["GITHUB_OUTPUT"]
              with open(path, "a", encoding="utf-8") as fh:
                  for key, value in kwargs.items():
                      fh.write(f"{key}={value}\n")

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True)

          def normalize(raw: str) -> str:
              raw = (raw or "").strip()
              if raw.lower().startswith("v") and re.match(r"v\d", raw, re.I):
                  return raw[1:]
              return raw

          def parse_core(ver: str):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:[-+].*)?", ver)
              if not m:
                  raise SystemExit(f"Invalid version: {ver!r}")
              return int(m.group(1)), int(m.group(2)), int(m.group(3))

          def format_core(major: int, minor: int, patch: int) -> str:
              return f"{major}.{minor}.{patch}"

          def replace_once(path: pathlib.Path, pattern: str, repl: str, flags=0):
              text = path.read_text(encoding="utf-8")
              new, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"Failed to update {path} (matches={n})")
              path.write_text(new, encoding="utf-8")

          def update_lock(version: str):
              path = pathlib.Path("Cargo.lock")
              members = {
                  "eyescare-core",
                  "eyescare-desktop",
                  "eyescare-platform",
                  "eyescare-platform-mac",
                  "eyescare-platform-win",
              }

              def repl(match: re.Match[str]) -> str:
                  name = match.group(1)
                  if name in members:
                      return f'name = "{name}"\nversion = "{version}"'
                  return match.group(0)

              text = path.read_text(encoding="utf-8")
              new, n = re.subn(r'name = "([^"]+)"\nversion = "[^"]+"', repl, text)
              if n < len(members):
                  raise SystemExit(f"Cargo.lock member versions updated {n}, expected >= {len(members)}")
              path.write_text(new, encoding="utf-8")

          def version_taken(tag: str) -> bool:
              viewed = gh("release", "view", tag, "--json", "id")
              if viewed.returncode == 0:
                  return True
              tagged = subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
                  capture_output=True,
              )
              return tagged.returncode == 0

          def bump_files(version: str):
              replace_once(
                  pathlib.Path("Cargo.toml"),
                  r'(?ms)(\[workspace\.package\].*?^version\s*=\s*")[^"]+(")',
                  rf"\g<1>{version}\2",
              )
              replace_once(
                  pathlib.Path("apps/desktop/package.json"),
                  r'("version"\s*:\s*")[^"]+(")',
                  rf"\g<1>{version}\2",
              )
              replace_once(
                  conf_path,
                  r'("version"\s*:\s*")[^"]+(")',
                  rf"\g<1>{version}\2",
              )
              update_lock(version)

          def commit_and_push(version: str, tag: str, branch: str):
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(
                  ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True,
              )
              subprocess.run(
                  [
                      "git",
                      "add",
                      "Cargo.toml",
                      "Cargo.lock",
                      "apps/desktop/package.json",
                      "apps/desktop/src-tauri/tauri.conf.json",
                  ],
                  check=True,
              )
              subprocess.run(["git", "commit", "-m", f"chore(release): {tag}"], check=True)
              subprocess.run(["git", "pull", "--rebase", "origin", branch], check=True)
              subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)
              print(f"Bumped version to {version} and pushed.")

          event = os.environ["EVENT_NAME"]
          ref_name = os.environ["REF_NAME"]
          ref_type = (os.environ.get("REF_TYPE") or "").strip()
          input_version = os.environ.get("INPUT_VERSION", "").strip()
          bump = (os.environ.get("INPUT_BUMP") or "none").strip()
          input_prerelease = os.environ.get("INPUT_PRERELEASE", "false").lower() == "true"
          commit_message = (os.environ.get("COMMIT_MESSAGE") or "").strip()
          if not commit_message:
              commit_message = subprocess.check_output(
                  ["git", "log", "-1", "--pretty=%B"], text=True
              ).strip()
          first_line = commit_message.splitlines()[0] if commit_message else ""

          subprocess.run(["git", "fetch", "--tags", "--force"], check=False)

          conf_path = pathlib.Path("apps/desktop/src-tauri/tauri.conf.json")
          current = json.loads(conf_path.read_text(encoding="utf-8"))["version"]

          skip = "false"
          should_bump = False

          if event == "workflow_dispatch":
              if input_version:
                  version = normalize(input_version)
                  parse_core(version)
              elif bump != "none":
                  major, minor, patch = parse_core(current)
                  if bump == "major":
                      version = format_core(major + 1, 0, 0)
                  elif bump == "minor":
                      version = format_core(major, minor + 1, 0)
                  elif bump == "patch":
                      version = format_core(major, minor, patch + 1)
                  else:
                      raise SystemExit(f"Unknown bump: {bump}")
              else:
                  version = current
              should_bump = version != current
          elif event == "push" and ref_type == "tag":
              version = normalize(ref_name)
              parse_core(version)
              if version != current:
                  raise SystemExit(
                      f"Tag v{version} does not match tauri.conf.json version {current}. "
                      "Bump the repo version first, or use workflow_dispatch."
                  )
          elif event == "push" and ref_type == "branch":
              lowered = commit_message.lower()
              if first_line.startswith("chore(release)") or "[skip release]" in lowered:
                  skip = "true"
                  version = current
                  print(f"Skipping auto-release for commit: {first_line}")
              else:
                  major, minor, patch = parse_core(current)
                  patch += 1
                  version = format_core(major, minor, patch)
                  while version_taken(f"v{version}"):
                      patch += 1
                      version = format_core(major, minor, patch)
                  should_bump = True
          else:
              raise SystemExit(f"Unsupported event: {event} ref_type={ref_type!r}")

          tag = f"v{version}"
          prerelease = "true" if (input_prerelease or "-" in version) else "false"

          if skip == "false" and event == "push" and ref_type == "tag":
              viewed = gh("release", "view", tag, "--json", "assets")
              if viewed.returncode == 0:
                  assets = json.loads(viewed.stdout or "{}").get("assets") or []
                  if assets:
                      skip = "true"
                      print(f"Release {tag} already has {len(assets)} asset(s); skipping duplicate tag run.")

          if skip == "false" and should_bump:
              bump_files(version)
              branch = ref_name if ref_type == "branch" else (ref_name or "main")
              if event == "workflow_dispatch":
                  branch = os.environ.get("GITHUB_REF_NAME") or ref_name or "main"
              commit_and_push(version, tag, branch)

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          write_output(skip=skip, version=version, tag=tag, sha=sha, prerelease=prerelease)
          print(f"version={version} tag={tag} sha={sha} skip={skip} prerelease={prerelease}")
          PY

  windows:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri (NSIS)
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis

      - name: Collect installer and portable zip
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null

          $found = @()
          foreach ($pat in @(
            "target/release/bundle/nsis/*.exe",
            "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          )) {
            $found += @(Get-ChildItem -Path $pat -ErrorAction SilentlyContinue)
          }
          if ($found.Count -eq 0) {
            throw "NSIS installer not found"
          }
          $found | Copy-Item -Destination dist-release -Force

          $binary = Get-ChildItem -Path @(
            "target/release/eyescare-desktop.exe",
            "apps/desktop/src-tauri/target/release/eyescare-desktop.exe"
          ) -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $binary) {
            throw "Portable executable not found"
          }
          $portable = "dist-release/EyesCare-$env:TAG-windows-x64-portable.zip"
          Compress-Archive -Path $binary.FullName -DestinationPath $portable -Force

          Get-ChildItem dist-release | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $hash, $_.Name
          } | Set-Content -Path dist-release/SHA256SUMS.txt -Encoding ascii

          Get-ChildItem dist-release | Format-Table Name, Length
          Get-Content dist-release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: EyesCare ${{ needs.prepare.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-release/*
          body: |
            ## 安装说明

            - **NSIS 安装包**（`EyesCare_*_x64-setup.exe`）：安装后从托盘打开设置；退出托盘才会还原 gamma
            - **免安装 ZIP**：解压后直接运行 `eyescare-desktop.exe`
            - **SHA256SUMS.txt**：校验下载文件

            未签名：Windows SmartScreen 可能提示，选「仍要运行」即可。
